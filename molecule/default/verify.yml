---
- name: "Verify"
  hosts: all
  gather_facts: true
  tasks:
    - name: "Skip on non-RedHat systems"
      ansible.builtin.meta: end_host
      when: ansible_os_family != 'RedHat'

    - name: "Check epel repo file exists"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/epel.repo
      register: epel_repo_file

    - name: "Assert epel repo file exists"
      ansible.builtin.assert:
        that:
          - epel_repo_file.stat.exists
        quiet: true

    - name: "Check local.repo is absent"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/local.repo
      register: local_repo_file

    - name: "Assert local.repo does not exist"
      ansible.builtin.assert:
        that:
          - not local_repo_file.stat.exists
        quiet: true
