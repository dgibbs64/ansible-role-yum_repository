---
- name: "Verify"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Check epel repo file exists"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/epel.repo
      register: epel_repo_file

    - name: "Assert epel repo file exists"
      ansible.builtin.assert:
        that:
          - epel_repo_file.stat.exists
        quiet: true

    - name: "Check junk repo files are absent"
      ansible.builtin.stat:
        path: "/etc/yum.repos.d/{{ item }}"
      register: junk_repo_files
      loop:
        - local.repo
        - CentOS-Base.repo
        - random-cruft.repo

    - name: "Assert junk repo files do not exist"
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        quiet: true
      loop: "{{ junk_repo_files.results }}"
      loop_control:
        label: "{{ item.item }}"
