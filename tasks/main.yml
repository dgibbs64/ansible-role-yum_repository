---
# tasks for yum_repository

- name: "Gathering facts"
  ansible.builtin.setup:
  when: ansible_facts|default({}) == {}

- name: "Assert"
  ansible.builtin.import_tasks: assert.yml
  run_once: true
  delegate_to: localhost

- name: "Become block"
  become: true
  block:
    - name: "Yum Repository"
      ansible.builtin.import_tasks: yum_repository.yml
