---
# List of yum repositories to manage.
# Each entry maps directly to ansible.builtin.yum_repository parameters.
# Set state: absent to remove a repository.
#
# Example:
# yum_repositories:
#   - name: epel
#     description: Extra Packages for Enterprise Linux
#     baseurl: https://download.fedoraproject.org/pub/epel/$releasever/$basearch/
#     gpgcheck: true
#     gpgkey: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-$releasever
#     enabled: true
#     state: present
#   - name: old-repo
#     state: absent
yum_repositories: []

# List of .repo filenames to explicitly remove from /etc/yum.repos.d/.
# Use this to clean up known junk files left by previous configuration.
#
# Example:
# yum_repository_files_absent:
#   - local.repo
#   - CentOS-Base.repo
#   - CentOS-AppStream.repo
yum_repository_files_absent: []

# When true, removes all .repo files in /etc/yum.repos.d/ that are not
# managed by this role (i.e. not generated by entries in yum_repositories).
# Use with caution — this will remove any repo file not in your yum_repositories list.
yum_repositories_purge: false
